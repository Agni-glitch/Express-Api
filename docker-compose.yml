name: cineflix

services:
  api:
    build: .
    restart: unless-stopped
    # CONN_STR (MongoDB Atlas), SECRET_STR, LOGIN_EXPIRES and the EMAIL_* settings
    # come from config.env (copy .env.example)
    env_file: config.env
    environment:
      PORT: 3000
      # requests arrive through the frontend's nginx proxy
      TRUST_PROXY: 1
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080}
    ports:
      - "${API_PORT:-3000}:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
